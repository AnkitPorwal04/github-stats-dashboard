      class="seg" style="animation-delay:730ms" /><circle cx="310" cy="190" r="92" fill="none" stroke="#34d399" stroke-width="30"
      stroke-dasharray="16.62 561.43" stroke-dashoffset="-558.43"
      class="seg" style="animation-delay:850ms" /></g>
  
    <g class="stagger" style="animation-delay:500ms">
