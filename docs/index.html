<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Stats Dashboard</title>
  <meta name="description" content="A self-hosted, interactive GitHub statistics dashboard." />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <div class="grid-overlay"></div>
  </div>

  <main class="container">
    <header class="hero reveal" id="profile">
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" alt="" width="120" height="120" />
        <span class="avatar-ring" aria-hidden="true"></span>
      </div>
      <div class="hero-meta">
        <div class="hero-top">
          <h1 id="name">Loading…</h1>
          <span class="live-pill" id="live-pill" title="Data is refreshed by a scheduled workflow">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="refreshed">Data refreshed —</span>
          </span>
        </div>
        <a id="login" class="login" href="#" target="_blank" rel="noopener"></a>
        <p id="bio" class="bio"></p>
        <div class="badges">
          <span class="badge" id="followers-badge"></span>
          <span class="badge" id="following-badge"></span>
          <span class="badge" id="repos-badge"></span>
          <span class="badge" id="since-badge"></span>
        </div>
      </div>
    </header>

    <section class="stat-grid reveal" id="stat-grid" aria-label="Key statistics"></section>

    <section class="streak-grid reveal" id="streak-grid" aria-label="Streaks"></section>

    <section class="card reveal" id="heatmap-card">
      <div class="card-head">
        <h2>Contribution activity</h2>
        <span class="muted" id="heatmap-total"></span>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap" id="heatmap" role="img" aria-label="Contribution heatmap"></div>
      </div>
      <div class="heatmap-legend">
        <span class="muted">Less</span>
        <span class="hm-cell l0"></span>
        <span class="hm-cell l1"></span>
        <span class="hm-cell l2"></span>
        <span class="hm-cell l3"></span>
        <span class="hm-cell l4"></span>
        <span class="muted">More</span>
      </div>
    </section>

    <section class="card chart-card reveal" id="range-card">
      <div class="card-head">
        <h2>Contribution timeline</h2>
        <div class="head-right">
          <span class="muted" id="range-total"></span>
          <div class="segmented" id="range-control" role="group" aria-label="Select time range">
            <button type="button" class="seg-btn" data-range="30D">30D</button>
            <button type="button" class="seg-btn" data-range="90D">90D</button>
            <button type="button" class="seg-btn" data-range="1Y">1Y</button>
          </div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="timelineChart"></canvas></div>
    </section>

    <section class="charts">
      <div class="card chart-card reveal">
        <div class="card-head"><h2>Top languages</h2></div>
        <div class="lang-layout">
          <div class="chart-wrap lang-chart-wrap"><canvas id="langChart"></canvas></div>
          <ul class="lang-list" id="lang-list"></ul>
        </div>
      </div>
      <div class="card chart-card reveal">
        <div class="card-head">
          <h2>Coding rhythm</h2>
          <span class="muted" id="rhythm-note"></span>
        </div>
        <div class="chart-wrap"><canvas id="rhythmChart"></canvas></div>
      </div>
    </section>

    <section class="card reveal" id="repos-card">
      <div class="card-head">
        <h2>Repository explorer</h2>
        <div class="segmented" id="sort-control" role="group" aria-label="Sort repositories">
          <button type="button" class="seg-btn" data-sort="stars">Stars</button>
          <button type="button" class="seg-btn" data-sort="forks">Forks</button>
          <button type="button" class="seg-btn" data-sort="name">Name</button>
        </div>
      </div>
      <div class="repo-grid" id="repo-grid"></div>
    </section>

    <section class="card reveal">
      <div class="card-head">
        <h2>Embeddable cards</h2>
        <button class="copy-btn" id="copy-embed" type="button">Copy README embed</button>
      </div>
      <p class="muted">Regenerated by the scheduled workflow — drop them into any README.</p>
      <div class="embeds">
        <img class="embed" src="./assets/stats.svg" alt="GitHub stats card" loading="lazy" />
        <img class="embed" src="./assets/top-langs.svg" alt="Top languages card" loading="lazy" />
      </div>
    </section>

    <footer class="footer">
      <span id="updated" class="muted"></span>
      <span class="dot">·</span>
      <a id="repo-link" href="#" target="_blank" rel="noopener" class="muted">source</a>
    </footer>
  </main>

  <div id="hm-tooltip" class="hm-tooltip" role="tooltip" aria-hidden="true"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="error" class="error hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
